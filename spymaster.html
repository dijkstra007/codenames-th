<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>สายลับ · เกมสายลับภาษาไทย</title>
<meta name="description" content="หน้าสำหรับสายลับ — ดูสีกุญแจของเกมสายลับภาษาไทย (Codenames แบบไม่เป็นทางการ)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Serif+Thai:wght@700;800&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1a1f'/%3E%3Cpath d='M8 10h16M8 16h16M8 22h10' stroke='%23e0b23c' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
<style>
  /* Spymaster-only tweaks */
  .spy-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    background: rgba(15,15,18,.75);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .spy-brand {
    display: flex; align-items: center; gap: 12px;
  }
  .spy-badge {
    font-family: var(--font-display);
    font-size: 20px; font-weight: 800;
    color: #e0b23c;
  }
  .spy-brand-sub { color: var(--text-mute); font-size: 12px; font-weight: 500; }

  .spy-warn {
    background: rgba(224,178,60,.12);
    border: 1px solid rgba(224,178,60,.35);
    color: #e0b23c;
    padding: 10px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    margin: 14px 22px 0;
  }

  .spy-main {
    flex: 1;
    padding: 18px 22px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
  }

  .spy-board {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 10px;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    min-height: 0;
  }

  .import-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  [hidden] { display: none !important; }
  .import-card {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-xl);
    padding: 36px;
    max-width: 520px;
    width: 100%;
    box-shadow: var(--shadow-3);
  }
  .import-card h2 {
    font-family: var(--font-display);
    font-size: 28px;
    margin: 0 0 6px;
    color: #e0b23c;
  }
  .import-card p {
    color: var(--text-dim);
    margin: 0 0 20px;
    line-height: 1.5;
    font-size: 14px;
  }
  .import-card textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 14px;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.4;
    resize: vertical;
    min-height: 110px;
  }
  .import-card textarea:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 2px;
    border-color: var(--text-dim);
  }
  .import-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    justify-content: flex-end;
  }
  .import-error {
    color: #ff6b7a;
    font-size: 13px;
    margin-top: 10px;
    min-height: 18px;
  }

  @media (max-width: 900px) {
    .spy-topbar { padding: 12px 14px; }
    .spy-warn { margin: 10px 14px 0; font-size: 12px; padding: 8px 12px; }
    .spy-main { padding: 12px; }
    .spy-board { gap: 8px; }
    .import-card { padding: 24px; }
    .import-card h2 { font-size: 22px; }
  }
</style>
</head>
<body>

<header class="spy-topbar">
  <div class="spy-brand">
    <svg width="34" height="34" viewBox="0 0 40 40" fill="none" role="img" aria-label="สายลับ">
      <rect x="2" y="2" width="36" height="36" rx="7" fill="#e0b23c" opacity="0.12"/>
      <path d="M12 16c0-4 3-7 8-7s8 3 8 7-3 7-8 7c-1 0-2-.1-2.9-.4L14 26l-2-2 3.3-3.3C13.2 19.4 12 17.8 12 16z" stroke="#e0b23c" stroke-width="2" fill="none"/>
      <circle cx="20" cy="16" r="2" fill="#e0b23c"/>
    </svg>
    <div>
      <div class="spy-badge">สายลับ</div>
      <div class="spy-brand-sub" id="spySub">หน้าสำหรับสายลับ</div>
    </div>
  </div>
  <div class="controls" id="spyControls" hidden>
    <button class="btn btn-ghost" id="changeCodeBtn">เปลี่ยนรหัส</button>
  </div>
</header>

<section class="import-screen" id="importScreen" hidden>
  <div class="import-card">
    <h2>วางรหัสจากผู้เล่น</h2>
    <p>รับรหัส Base64 หรือลิงก์จากคนที่กดปุ่ม "แชร์ให้สายลับ" บนเครื่องหลัก แล้ววางด้านล่าง รหัสนี้คือกุญแจทั้งกระดาน</p>
    <textarea id="codeInput" placeholder="วางรหัสหรือลิงก์ที่นี่..."></textarea>
    <div class="import-error" id="importError"></div>
    <div class="import-actions">
      <button class="btn btn-primary" id="loadBtn">โหลดกุญแจ</button>
    </div>
  </div>
</section>

<div class="spy-warn" id="spyWarn" hidden>⚠︎ เฉพาะสายลับเท่านั้น — อย่าให้ผู้เล่นคนอื่นเห็นหน้าจอนี้</div>
<main class="spy-main" id="spyMain" hidden>
  <div class="spy-board" id="spyBoard"></div>
</main>

<footer class="site-foot">โปรเจกต์แฟนที่ไม่เป็นทางการ ไม่เกี่ยวข้องกับ Czech Games Edition</footer>

<script src="spymaster.js" type="module"></script>
</body>
</html>
